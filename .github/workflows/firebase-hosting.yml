# Publica RadioGuía en Firebase Hosting (https://app-rx-188a6.web.app) cada vez que se fusiona algo en main.
# Usa el secreto FIREBASE_SERVICE_ACCOUNT del repositorio: la clave JSON de una cuenta de servicio de Google Cloud
# que solo puede publicar en Hosting (ver el PR de la mudanza). GitHub Pages sigue publicando el sitio viejo por su lado.
name: Publicar en Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # fijadas a un commit exacto (no a una etiqueta que se puede mover): esta acción recibe la clave de publicación
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0 al 4/11/2026
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-rx-188a6
          channelId: live
