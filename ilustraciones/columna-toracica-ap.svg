aderas y rodillas flexionadas:</tspan><tspan x="560" dy="16" fill="#1b1d22">menos curvatura lordótica</tspan></text><line x1="616" y1="240" x2="616.0" y2="274.0" stroke="#1b1d22" stroke-width="1.1"/><text x="560" y="288" font-size="13.5" fill="#1b1d22" text-anchor="start"><tspan font-weight="700">Parte baja de la columna</tspan><tspan x="560" dy="16" fill="#1b1d22">hacia el cátodo (efecto talón)</tspan></text><text x="40" y="300" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Borde superior del RI al menos 3 cm sobre los hombros · sin rotación · DFRI 100 cm</text><text x="40" y="315" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Exponer en espiración · campo largo y estrecho hasta la columna T</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>