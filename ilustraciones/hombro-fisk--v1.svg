" y="260" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">para ubicar el surco</text><text x="470" y="300" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 18 x 24 horizontal · sin parrilla · apnea</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>