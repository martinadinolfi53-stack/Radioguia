ext-anchor="start" font-weight="400">DFRI 180 cm de pie · 100 cm en decúbito</text><text x="418" y="294" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Se prefiere en decúbito (aquí, de pie)</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>