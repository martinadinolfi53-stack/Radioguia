</text><text x="540" y="172" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">plomadas para el personal</text><text x="540" y="188" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Exposición automática o manual</text><text x="540" y="204" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">El médico maneja la fluoroscopia</text><text x="540" y="220" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">con un pedal</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>