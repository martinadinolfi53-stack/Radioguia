arrilla · DFRI 100 cm</text><text x="430" y="277" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Apnea · no hacerla si puede haber fractura</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>