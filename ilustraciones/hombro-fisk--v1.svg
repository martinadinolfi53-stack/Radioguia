<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" font-family="IBM Plex Sans, Carlito, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23b2f"/></marker></defs><rect x="12" y="9" width="201" height="18" rx="9" fill="#0b7a6a"/><text x="20" y="22" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".05em">CÓMO SE UBICA EL PACIENTE</text><path d="M11.7,228.4 L148.7,322 L438.3,182.6 L301.3,89 Z" fill="#d5d9e1" stroke="#9aa0ac" stroke-width="1.4" stroke-linejoin="round"/><path d="M311.2,153.8 L244.9,108.5 L258.6,36 L324.9,81.3 Z" fill="#e6e8ee" stroke="#1b1d22" stroke-width="2.5" stroke-linejoin="round"/><image x="189.4" y="64.5" width="207.6" height="161" href="data:image/webp;base64,"/><text x="258.6" y="48" font-size="10.5" fill="#1b1d22" text-anchor="middle" font-weight="700">Bucky / RI</text><line x1="159.8" y1="125.4" x2="259.9" y2="101.1" stroke="#d23b2f" stroke-width="3" marker-end="url(#ar)"/><circle cx="266.7" cy="99.4" r="4" fill="#d23b2f"/><text x="159.8" y="141.4" font-size="11" fill="#d23b2f" text-anchor="middle" font-weight="700">RC</text><text x="470" y="50" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">Decúbito supino, brazo un poco</text><text x="470" y="65" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">separado y mano en supinación</text><text x="470" y="92" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">RI vertical contra la parte</text><text x="470" y="107" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">superior del hombro, ⟂ al RC</text><text x="470" y="122" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">(como en la fig. 3.23 del libro)</text><text x="470" y="152" font-size="12" fill="#d23b2f" text-anchor="start" font-weight="700">RC desde los pies, casi horizontal:</text><text x="470" y="167" font-size="12" fill="#d23b2f" text-anchor="start" font-weight="700">angulación 10-15° hacia posterior</text><text x="470" y="182" font-size="12" fill="#d23b2f" text-anchor="start" font-weight="700">desde la horizontal, tangencial</text><text x="470" y="197" font-size="12" fill="#d23b2f" text-anchor="start" font-weight="700">al surco bicipital</text><text x="470" y="226" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Palpar la cabeza humeral anterior</text><text x="470" y="241" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">para ubicar el surco</text><text x="470" y="290" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 18 x 24 horizontal · sin parrilla · apnea</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>