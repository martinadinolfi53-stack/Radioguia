>⊕ RC perpendicular al</tspan><tspan x="420" dy="16" fill="#1b1d22">centro del RI</tspan></text><text x="420" y="100" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">(más arriba si interesa la columna torácica)</text><text x="420" y="130" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">1.ª toma: máxima flexión hacia la derecha</text><text x="420" y="160" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Pelvis fija (fulcro), sin rotar pelvis ni torso</text><text x="420" y="175" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">De pie o en decúbito supino</text><text x="420" y="206" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">▭ punteado = RI</text><text x="420" y="221" font-size="11.5" fill="#1f5fa8" text-anchor="start" font-weight="700">Borde inferior del RI</text><text x="420" y="236" font-size="11.5" fill="#1f5fa8" text-anchor="start" font-weight="400">2,5-5 cm bajo la cresta</text><text x="420" y="270" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 35 x 43 o 35 x 90 · DFRI 100-150 cm</text><text x="420" y="285" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Espiración</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>