tremidad incluida.</text><text x="12" y="306" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Puede hacer falta otro RI para</text><text x="12" y="322" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">la pelvis o el fémur proximal.</text><text x="560" y="160" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 100 cm</text><text x="560" y="176" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Sin parrilla</text><text x="560" y="200" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Padres solo si hace falta,</text><text x="560" y="216" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">con guantes y delantal plomados</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>