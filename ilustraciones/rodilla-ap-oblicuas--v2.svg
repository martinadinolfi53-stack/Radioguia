ght="700">RC perpendicular al RI, 1,25 cm</tspan><tspan x="430" dy="16" fill="#1b1d22">por debajo de la rótula (mitad</tspan><tspan x="430" dy="16" fill="#1b1d22">del espacio articular)</tspan></text><text x="430" y="130" font-size="12.5" fill="#1b1d22" text-anchor="start" font-weight="700">Rotar 45° hacia afuera toda la</text><text x="430" y="145" font-size="12.5" fill="#1b1d22" text-anchor="start" font-weight="700">extremidad</text><text x="430" y="180" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Semidecúbito supino, pierna extendida</text><text x="430" y="195" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">y centrada en el RC y en la línea</text><text x="430" y="210" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">media de la mesa</text><text x="430" y="240" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Muestra los cóndilos mediales del</text><text x="430" y="255" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">fémur y la tibia de perfil</text><text x="430" y="290" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 24 x 30 vertical · DFRI 100 cm</text><text x="430" y="305" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Parrilla si el grosor supera 10 cm</text><text x="12" y="44" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Rodilla derecha, vista desde los pies</text><text x="12" y="324" font-size="10.5" fill="#5d6270" text-anchor="start" font-weight="400">punteado: rodilla sin rotar · línea azul: frente de la rodilla (rótula)</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>