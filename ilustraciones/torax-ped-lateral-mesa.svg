d22">ellos (cinta y bolsas de arena)</tspan></text><line x1="342" y1="137.40000000000003" x2="466.0" y2="168.0" stroke="#1b1d22" stroke-width="1.1"/><text x="470" y="172" font-size="13.5" fill="#1b1d22" text-anchor="start"><tspan font-weight="700">Piernas flexionadas y fijadas;</tspan><tspan x="470" dy="16" fill="#1b1d22">protección plomada en la pelvis</tspan></text><text x="470" y="214" font-size="11.5" fill="#1f5fa8" text-anchor="start" font-weight="700">Lateral verdadera, sin rotación</text><text x="470" y="240" font-size="11" fill="#1b1d22" text-anchor="start" font-weight="400">RI 18 × 24 o 24 × 30 cm vertical</text><text x="470" y="254" font-size="11" fill="#d23b2f" text-anchor="start" font-weight="400">DFRI mín. 128-150 cm, tubo lo más alto</text><text x="470" y="268" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Sin parrilla (salvo que no se pueda retirar)</text><text x="20" y="300" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Colimación estrecha a los 4 lados · 2.ª inspiración completa (si llora, en inspiración completa)</text><text x="20" y="316" font-size="10.5" fill="#5d6270" text-anchor="start" font-weight="400">Si ayuda un padre o una madre: sostiene brazos y cabeza con una mano y piernas con la otra, con delantal y guantes plomados</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>