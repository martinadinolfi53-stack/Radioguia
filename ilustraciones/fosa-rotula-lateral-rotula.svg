pan><tspan x="480" dy="16" fill="#1b1d22">articular femororrotuliano</tspan></text><line x1="240" y1="213.5" x2="124.0" y2="286.0" stroke="#8c7f6a" stroke-width="1.1"/><text x="120" y="290" font-size="13.5" fill="#8c7f6a" text-anchor="end"><tspan font-weight="700">rótula</tspan></text><text x="480" y="150" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">No flexionar más: puede</text><text x="480" y="166" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">separar fragmentos si hay fractura</text><text x="480" y="200" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">RI 18 × 24 vert. · DFRI 100 cm</text><text x="480" y="216" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Sin parrilla (con parrilla en</text><text x="480" y="232" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">pacientes de contextura grande)</text><text x="480" y="270" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Pierna sana hacia atrás</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>