erna para que la rótula no apoye</text><text x="470" y="316" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 100 cm · parrilla</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>