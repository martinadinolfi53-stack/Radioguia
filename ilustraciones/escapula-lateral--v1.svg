ápula y</text><text x="430" y="160" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">rotar el tórax hasta que su cuerpo</text><text x="430" y="175" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">quede ⟂ al RI (45-60°)</text><text x="430" y="214" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">Cruzar el brazo por delante y</text><text x="430" y="229" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">tomarse el hombro opuesto</text><text x="430" y="270" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 24 x 30 vertical · apnea</text><text x="430" y="285" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 100 cm</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>