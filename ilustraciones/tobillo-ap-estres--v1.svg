0" y="60" font-size="13.5" fill="#d23b2f" text-anchor="start"><tspan font-weight="700">RC perpendicular al RI, a mitad</tspan><tspan x="430" dy="16" fill="#1b1d22">de camino entre los maléolos</tspan></text><text x="430" y="120" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">Decúbito supino o sentado,</text><text x="430" y="135" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">pierna extendida, sin rotar la</text><text x="430" y="150" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">pierna ni el tobillo (AP verdadera)</text><text x="430" y="180" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Forzar el tobillo girando la planta</text><text x="430" y="195" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">hacia adentro (inversión)</text><text x="430" y="226" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Sobrecarga con mucho cuidado: gasa larga</text><text x="430" y="241" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">que sostiene el paciente, o a mano por</text><text x="430" y="256" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">personal capacitado con guantes y delantal</text><text x="430" y="271" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">plomados</text><text x="430" y="300" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 24 × 30 vert. o 35 × 43 · DFRI 100 cm</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>