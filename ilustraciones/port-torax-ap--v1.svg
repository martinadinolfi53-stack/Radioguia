xt-anchor="start"><tspan font-weight="700">RI 35 x 43 con funda, detrás de la espalda;</tspan><tspan x="30" dy="16" fill="#1b1d22">borde sup. 5 cm sobre los hombros</tspan></text><text x="470" y="116" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">Decúbito supino, cuando no se puede</text><text x="470" y="131" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">levantar el respaldo de la cama</text><text x="470" y="160" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Sin rotación</text><text x="470" y="175" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Hombros hacia adelante si se puede</text><text x="470" y="302" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 120-180 cm (la mayor posible) · con o sin parrilla</text><text x="470" y="317" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Exponer tras la 2.ª inspiración</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>