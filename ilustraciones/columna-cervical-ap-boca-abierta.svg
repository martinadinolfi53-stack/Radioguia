 text-anchor="start"><tspan font-weight="700">Incisivos superiores y punta</tspan><tspan x="420" dy="16" fill="#1b1d22">de las mastoides: línea</tspan><tspan x="420" dy="16" fill="#1b1d22">perpendicular a la mesa</tspan></text><line x1="276.4" y1="158.2" x2="416.0" y2="164.0" stroke="#7a3b33" stroke-width="1.1"/><text x="420" y="168" font-size="13.5" fill="#7a3b33" text-anchor="start"><tspan font-weight="700">Abrir bien la boca al final,</tspan><tspan x="420" dy="16" fill="#1b1d22">sin mover la cabeza</tspan></text><text x="30" y="302" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Decúbito supino o de pie · apnea · colimar ajustado a C1-C2</text><text x="30" y="317" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Si la línea no queda perpendicular, angular el RC para compensar</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>