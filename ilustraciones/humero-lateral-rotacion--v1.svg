.5" fill="#1b1d22" text-anchor="start" font-weight="700">Codo flexionado 90°, antebrazo por</text><text x="430" y="195" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">delante del abdomen</text><text x="430" y="210" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Epicóndilos perpendiculares al RI</text><text x="430" y="225" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">(lateral verdadera)</text><text x="430" y="262" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 35 x 43 o 30 x 35 vertical · DFRI 100 cm</text><text x="430" y="277" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Incluir codo y hombro</text><text x="430" y="292" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">No rotar si hay sospecha de fractura</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>