270" text-anchor="start" font-weight="400">Muestra la cabeza y el cuello del peroné</text><text x="430" y="255" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">sin superposición</text><text x="430" y="290" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 24 × 30 vert. · DFRI 100 cm</text><text x="430" y="305" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Parrilla si el grosor supera 10 cm</text><text x="12" y="40" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Rodilla derecha, vista desde los pies</text><text x="12" y="324" font-size="10.5" fill="#5d6270" text-anchor="start" font-weight="400">claro: rodilla sin rotar · línea azul: hacia la rótula</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>