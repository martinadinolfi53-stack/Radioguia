b2f" text-anchor="start"><tspan font-weight="700">RC perpendicular en el</tspan><tspan x="560" dy="16" fill="#1b1d22">punto medio del antebrazo</tspan></text><line x1="508" y1="226" x2="556.0" y2="156.0" stroke="#c98a00" stroke-width="1.1"/><text x="560" y="160" font-size="13.5" fill="#c98a00" text-anchor="start"><tspan font-weight="700">Incluir muñeca y codo,</tspan><tspan x="560" dy="16" fill="#1b1d22">con al menos 2,5 cm más</tspan><tspan x="560" dy="16" fill="#1b1d22">allá de cada articulación</tspan></text><text x="560" y="250" font-size="12" fill="#1b1d22" text-anchor="start" font-weight="700">Brazo extendido, mano</text><text x="560" y="266" font-size="12" fill="#1b1d22" text-anchor="start" font-weight="700">en supinación</text><text x="560" y="290" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Pacientes pequeños: RI 30 x 35</text><text x="560" y="304" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 100 cm · sin parrilla</text><text x="30" y="270" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Si hace falta, inclinar al</text><text x="30" y="284" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">paciente hacia lateral para</text><text x="30" y="298" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">una AP verdadera</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>