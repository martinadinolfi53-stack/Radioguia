span><tspan x="470" dy="16" fill="#1b1d22">escotadura yugular (T7)</tspan></text><line x1="206.74571727717978" y1="221.04473397198473" x2="206.7" y2="286.0" stroke="#1b1d22" stroke-width="1.1"/><text x="60" y="300" font-size="13.5" fill="#1b1d22" text-anchor="start"><tspan font-weight="700">RI 35 x 43 con funda, detrás de la espalda;</tspan><tspan x="60" dy="16" fill="#1b1d22">borde sup. 5 cm sobre los hombros</tspan></text><text x="470" y="116" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">Respaldo levantado, si se puede:</text><text x="470" y="131" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="700">sentado o semierguido</text><text x="470" y="160" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Sin rotación</text><text x="470" y="175" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Hombros hacia adelante si se puede</text><text x="470" y="206" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">DFRI 120-180 cm (la mayor posible)</text><text x="470" y="221" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Con o sin parrilla</text><text x="470" y="236" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">Exponer tras la 2.ª inspiración</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>