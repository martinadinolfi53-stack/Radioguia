<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" font-family="IBM Plex Sans, Carlito, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d23b2f"/></marker></defs><text x="12" y="20" font-size="12" font-weight="700" fill="#5d6270" letter-spacing=".06em">CORTE DEL CUELLO VISTO DESDE LA CABEZA · DECÚBITO SUPINO</text><rect x="30" y="236" width="330" height="12" fill="#cfd3dc"/><text x="36" y="246" font-size="10" fill="#5d6270">Mesa</text><rect x="66" y="254" width="120" height="9" fill="#1b1d22"/><text x="66" y="280" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">RI 24 x 30 · parrilla</text><circle cx="190" cy="182" r="53" fill="#b9c6d8" fill-opacity=".55" stroke="#6f7f96" stroke-width="1.3"/><circle cx="190" cy="182" r="46" fill="#f6e3d3" stroke="#9a7a63" stroke-width="2"/><path d="M176,188 L204,188 L204,206 L176,206 Z" fill="#ece4d4" stroke="#8c7f6a" stroke-width="1.4" stroke-linejoin="round" opacity=".95" /><path d="M187,208 L193,208 L192,224 L188,224 Z" fill="#ece4d4" stroke="#8c7f6a" stroke-width="1.4" stroke-linejoin="round" opacity=".95" /><circle cx="190" cy="156" r="7" fill="#fff" stroke="#9a7a63" stroke-width="1.2"/><text x="200" y="152" font-size="10.5" fill="#8c7f6a" text-anchor="start" font-style="italic">tráquea</text><text x="208" y="200" font-size="10.5" fill="#8c7f6a" text-anchor="start" font-style="italic">C4</text><text x="134" y="142" font-size="10.5" fill="#6f7f96" text-anchor="end" font-weight="400">collarín</text><g transform="rotate(45 310.2081528017131 77.79184719828692)"><rect x="268.2081528017131" y="55.791847198286916" width="84" height="40" rx="6" fill="#e9ebf0" stroke="#8a8f9c"/><text x="310.2081528017131" y="80.79184719828692" font-size="12" text-anchor="middle" fill="#5d6270">Tubo</text></g><line x1="293.2375900532359" y1="94.76240994676405" x2="195.65685424949237" y2="192.34314575050763" stroke="#d23b2f" stroke-width="3" marker-end="url(#ar)"/><line x1="190" y1="198" x2="190" y2="96" stroke="#d23b2f" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M190,96 A102,102 0 0 1 262.12489168102786,125.87510831897215" fill="none" stroke="#d23b2f" stroke-width="1.3"/><text x="235.1566450190806" y="92.98221516366816" font-size="13" font-weight="700" fill="#d23b2f" text-anchor="middle">45°</text><line x1="190.0" y1="198.0" x2="126.0" y2="262.0" stroke="#d23b2f" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="250" y1="70" x2="396.0" y2="46.0" stroke="#d23b2f" stroke-width="1.1"/><text x="400" y="50" font-size="13.5" fill="#d23b2f" text-anchor="start"><tspan font-weight="700">RC angulado 45° hacia medial</tspan><tspan x="400" dy="16" fill="#1b1d22">entra a la altura de C4</tspan></text><text x="400" y="104" font-size="12" fill="#d23b2f" text-anchor="start" font-weight="400">+15° cefálico si no se usa parrilla</text><text x="400" y="140" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Sin mover al paciente ni quitar el collarín:</text><text x="400" y="157" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">la oblicuidad la da el tubo</text><text x="400" y="174" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Se hace derecha e izquierda</text><text x="400" y="191" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">DFRI 100-120 cm</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>