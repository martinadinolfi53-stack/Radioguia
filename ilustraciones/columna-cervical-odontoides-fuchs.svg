 x1="280.2" y1="122.1" x2="416.0" y2="114.0" stroke="#1f5fa8" stroke-width="1.1"/><text x="420" y="118" font-size="13.5" fill="#1f5fa8" text-anchor="start"><tspan font-weight="700">Mentón levantado: LMM casi</tspan><tspan x="420" dy="16" fill="#1b1d22">perpendicular al RI</tspan><tspan x="420" dy="16" fill="#1b1d22">(si no alcanza, angular algo a cefálico)</tspan></text><text x="262.3" y="198.1" font-size="10.5" fill="#8c7f6a" text-anchor="start" font-style="italic">mastoides</text><text x="30" y="302" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">Decúbito supino o de pie · PMS en la línea central, sin rotación · apnea · DFRI 100 cm</text><text x="30" y="317" font-size="11.5" fill="#5d6270" text-anchor="start" font-weight="400">RI centrado en la salida del RC · no hacerla si se sospecha traumatismo</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>