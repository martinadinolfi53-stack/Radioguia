="200.0" y1="176.9" x2="310.0" y2="176.9" stroke="#5d6270" stroke-width="1" stroke-dasharray="2 3"/><line x1="200.0" y1="176.9" x2="200.0" y2="76.9" stroke="#5d6270" stroke-width="1" stroke-dasharray="2 3"/><path d="M258.0,176.9 A58,58 0 0 1 219.8,231.4" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="258.9789471888074" y="222.18542717453744" font-size="12.5" fill="#1f5fa8" text-anchor="middle" font-weight="700">70°</text><path d="M168.5,90.4 A92,92 0 0 1 200.0,84.9" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="181.59329316730538" y="76.49830193796807" font-size="12.5" fill="#1f5fa8" text-anchor="middle" font-weight="700"></text><text x="212" y="72.88792375726212" font-size="12.5" fill="#1f5fa8" text-anchor="start" font-weight="700">20°</text><line x1="179.7" y1="40" x2="179.7" y2="174.3" stroke="#d23b2f" stroke-width="3" marker-end="url(#ar)"/><line x1="179.7" y1="184.3" x2="179.7" y2="268.0" stroke="#d23b2f" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="181.70263939102438" y1="60" x2="416.0" y2="46.0" stroke="#d23b2f" stroke-width="1.1"/><text x="420" y="50" font-size="13.5" fill="#d23b2f" text-anchor="start"><tspan font-weight="700">RC perpendicular al centro del RI, en T7</tspan><tspan x="420" dy="16" fill="#1b1d22">8-10 cm bajo la escotadura yugular</tspan><tspan x="420" dy="16" fill="#1b1d22">o 5 cm bajo el ángulo esternal</tspan></text><text x="420" y="126" font-size="12.5" fill="#1f5fa8" text-anchor="start" font-weight="400">Desde la lateral, rotar 20° hacia atrás</text><text x="420" y="142" font-size="12.5" fill="#1f5fa8" text-anchor="start" font-weight="400">(OPD a 70° del RI)</text><text x="420" y="176" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Decúbito lateral o de pie</text><text x="420" y="192" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Brazo alejado del RI detrás de la espalda;</text><text x="420" y="208" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">el cercano levantado, delante de la cabeza</text><text x="420" y="224" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Borde superior del RI ≥3 cm sobre los hombros</text><text x="420" y="240" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Espiración · DFRI 100 cm · se hacen las dos</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>