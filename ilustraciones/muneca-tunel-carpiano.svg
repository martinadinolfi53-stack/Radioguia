 r="4.5" fill="#d23b2f"/><line x1="317.6360388562188" y1="218.2518020141282" x2="264.0" y2="166.0" stroke="#d23b2f" stroke-width="1.1"/><text x="260" y="170" font-size="13.5" fill="#d23b2f" text-anchor="end"><tspan font-weight="700">RC 25-30° respecto del</tspan><tspan x="260" dy="16" fill="#1b1d22">eje largo de la palma</tspan></text><line x1="326.5249105773149" y1="92.3526688809427" x2="264.0" y2="76.0" stroke="#1f5fa8" stroke-width="1.1"/><text x="260" y="80" font-size="13.5" fill="#1f5fa8" text-anchor="end"><tspan font-weight="700">Eje largo de la palma</tspan></text><text x="520" y="60" font-size="12" fill="#1b1d22" text-anchor="start" font-weight="700">Centrado unos 2-3 cm distal</text><text x="520" y="76" font-size="12" fill="#1b1d22" text-anchor="start" font-weight="700">a la base del 3.er metacarpiano</text><text x="520" y="110" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Hiperextensión (flexión dorsal)</text><text x="520" y="125" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">todo lo que tolere: el paciente</text><text x="520" y="140" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">sostiene los dedos hacia atrás</text><text x="520" y="155" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">con la otra mano.</text><text x="520" y="186" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Rotar unos 10° hacia interno</text><text x="520" y="201" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">(hacia el radio).</text><text x="520" y="216" font-size="11.5" fill="#1b1d22" text-anchor="start" font-weight="400">Trabajar rápido: puede doler.</text><text x="520" y="250" font-size="11.5" fill="#c98a00" text-anchor="start" font-weight="400">Colimar al carpo (~7,5 cm)</text><text x="520" y="290" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">RI 18 x 24 vertical · DFRI 100 cm · sin parrilla</text><text x="60" y="300" font-size="11" fill="#5d6270" text-anchor="start" font-weight="400">antebrazo sobre el RI →</text><text x="12" y="348" font-size="10.5" fill="#5d6270">Esquema didáctico, no a escala · pendiente de validación docente · → / ⊕ rayo central · ▬ RI · ┅ colimación</text></svg>